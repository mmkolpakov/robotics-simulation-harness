---
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: robotics-acceptance-harness

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-ros:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          path: robotics-acceptance-harness
      - name: Build isolated ROS 2 Jazzy test environment
        run: docker build --file tests/live/Dockerfile --tag harness-live:ci .
      - name: Run real ROS observer and CLI integration tests
        run: |
          mkdir -p artifacts/live
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --mount "type=bind,source=${PWD}/artifacts/live,target=/harness/artifacts/live" \
            harness-live:ci
      - name: Upload live results and Collector OTLP golden output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: harness-live-jazzy-${{ github.sha }}
          path: robotics-acceptance-harness/artifacts/live/
          if-no-files-found: warn
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          path: robotics-acceptance-harness
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: robotics-acceptance-harness/uv.lock
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Run repository checks
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Run tests with coverage
        run: |
          mkdir -p artifacts
          uv run coverage run --branch -m pytest \
            -p robotics_acceptance_harness.plugin \
            --robotics-scenario tests/fixtures/simulation/scenario.yaml \
            --robotics-runtime tests/fixtures/simulation/runtime.yaml \
            --junitxml=artifacts/junit.xml
          uv run coverage report --show-missing --fail-under=80
          uv run coverage xml -o artifacts/coverage.xml
      - name: Build wheel and source distribution
        run: |
          uv export --locked --no-dev --no-emit-project \
            --format requirements.txt \
            --output-file artifacts/runtime-requirements.txt
          uv build --no-sources --out-dir artifacts/dist
      - name: Verify installed wheel
        run: |
          uv venv --python 3.12 .wheel-venv
          uv pip install --python .wheel-venv/bin/python \
            "pytest>=8,<10" \
            --requirement artifacts/runtime-requirements.txt \
            artifacts/dist/*.whl
          .wheel-venv/bin/robotics-acceptance --version
          .wheel-venv/bin/robotics-acceptance explain \
            --scenario tests/fixtures/simulation/scenario.yaml \
            --runtime tests/fixtures/simulation/runtime.yaml \
            > artifacts/installed-wheel-explain.json
          .wheel-venv/bin/python -m pytest \
            -p robotics_acceptance_harness.plugin \
            --help | grep -- --robotics-scenario
      - name: Verify installed wheel with protobuf 5
        run: |
          uv pip install --python .wheel-venv/bin/python --no-deps "protobuf==5.29.5"
          uv pip check --python .wheel-venv/bin/python
          .wheel-venv/bin/python -m pytest tests/test_otel.py tests/test_traces.py
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: harness-validation-${{ github.sha }}
          path: robotics-acceptance-harness/artifacts/
          if-no-files-found: warn
          retention-days: 7

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          path: robotics-acceptance-harness
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: robotics-acceptance-harness/uv.lock
      - name: Install Python
        run: uv python install "${{ matrix.python }}"
      - name: Synchronize locked environment
        run: uv sync --python "${{ matrix.python }}" --locked --all-groups
      - name: Run tests
        run: >-
          uv run pytest
          -p robotics_acceptance_harness.plugin
          --robotics-scenario tests/fixtures/simulation/scenario.yaml
          --robotics-runtime tests/fixtures/simulation/runtime.yaml
